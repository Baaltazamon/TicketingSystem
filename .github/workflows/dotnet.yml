name: dotnet

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Restore
        run: dotnet restore SupportPilot.sln

      - name: Build
        run: dotnet build SupportPilot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SupportPilot.sln --configuration Release --no-build

      - name: Publish API
        run: dotnet publish src/SupportPilot.Api/SupportPilot.Api.csproj --configuration Release --no-build --output artifacts/api

      - name: Publish Notifications Worker
        run: dotnet publish src/SupportPilot.Notifications.Worker/SupportPilot.Notifications.Worker.csproj --configuration Release --no-build --output artifacts/notifications-worker

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: supportpilot-api
          path: artifacts/api

      - name: Upload Notifications Worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: supportpilot-notifications-worker
          path: artifacts/notifications-worker

  docker-compose-smoke:
    runs-on: ubuntu-latest
    needs: build-test-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and start Docker Compose stack
        run: docker compose up --build -d

      - name: Run Docker Compose smoke test
        run: node scripts/docker-smoke.mjs

      - name: Dump Docker Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v
