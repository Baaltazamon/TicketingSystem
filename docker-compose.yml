services:
  api:
    build:
      context: .
      dockerfile: src/SupportPilot.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: PostgreSql
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-supportpilot};Username=${POSTGRES_USER:-supportpilot};Password=${POSTGRES_PASSWORD:-supportpilot}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMQ: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      Cache__Provider: Redis
      Cache__DefaultExpirationSeconds: 300
      Cache__KnowledgeBaseExpirationSeconds: 300
      Cache__ReportsExpirationSeconds: 30
      FileStorage__Provider: Minio
      FileStorage__Endpoint: minio:9000
      FileStorage__AccessKey: ${MINIO_ROOT_USER:-supportpilot}
      FileStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-supportpilot123}
      FileStorage__BucketName: ${MINIO_BUCKET:-supportpilot-attachments}
      FileStorage__UseSsl: false
      Notifications__Transport: RabbitMQ
      Notifications__QueueName: ${NOTIFICATIONS_QUEUE:-supportpilot.notifications}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-DOCKER_SUPPORTPILOT_SECRET_32_CHARS_MINIMUM}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  notifications-worker:
    build:
      context: .
      dockerfile: src/SupportPilot.Notifications.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      Database__Provider: PostgreSql
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-supportpilot};Username=${POSTGRES_USER:-supportpilot};Password=${POSTGRES_PASSWORD:-supportpilot}
      ConnectionStrings__RabbitMQ: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      Notifications__Transport: RabbitMQ
      Notifications__QueueName: ${NOTIFICATIONS_QUEUE:-supportpilot.notifications}
      FileStorage__Provider: Minio
      FileStorage__Endpoint: minio:9000
      FileStorage__AccessKey: ${MINIO_ROOT_USER:-supportpilot}
      FileStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-supportpilot123}
      FileStorage__BucketName: ${MINIO_BUCKET:-supportpilot-attachments}
      FileStorage__UseSsl: false
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-DOCKER_SUPPORTPILOT_SECRET_32_CHARS_MINIMUM}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportpilot}
      POSTGRES_USER: ${POSTGRES_USER:-supportpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportpilot} -d ${POSTGRES_DB:-supportpilot}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-supportpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supportpilot123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
